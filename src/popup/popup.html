<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>DocViewer</title>
  </head>
  <body class="popup">
    <h1 class="popup__title">DocViewer</h1>
    <p class="popup__status">Office downloads open in a preview tab.</p>
    <p class="popup__saved" id="popup-saved" role="status" aria-live="polite">Saved ✓</p>

    <label class="popup__row">
      <input type="checkbox" id="toggle-interception" />
      <span>Auto-open Office downloads in the viewer</span>
    </label>

    <label class="popup__row" id="site-row" hidden>
      <input type="checkbox" id="toggle-site" />
      <span>Don’t preview on <strong id="site-host"></strong></span>
    </label>

    <label class="popup__row popup__row--select" title="Choose how PowerPoint files are rendered">
      <span>PowerPoint quality</span>
      <select id="pptx-renderer" aria-label="PowerPoint rendering quality">
        <option value="ordalie">High quality (recommended — full shapes &amp; effects)</option>
        <option value="aiden0z">Fast (quicker to open; used automatically for very large decks)</option>
      </select>
    </label>

    <button id="btn-bakeoff" class="btn" type="button" title="Open the same PowerPoint side by side in both renderers to compare quality" aria-label="Compare PowerPoint renderers side by side">Compare PowerPoint quality…</button>
    <button id="btn-open-viewer" class="btn btn--primary" type="button" title="Open the document viewer in a new tab" aria-label="Open the document viewer">Open viewer</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
