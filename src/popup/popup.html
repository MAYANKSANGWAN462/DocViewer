<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>DocViewer</title>
  </head>
  <body class="popup">
    <h1 class="popup__title">DocViewer</h1>
    <p class="popup__status">Office downloads open in a preview tab.</p>

    <label class="popup__row">
      <input type="checkbox" id="toggle-interception" />
      <span>Auto-open Office downloads in the viewer</span>
    </label>

    <label class="popup__row" id="site-row" hidden>
      <input type="checkbox" id="toggle-site" />
      <span>Don’t preview on <strong id="site-host"></strong></span>
    </label>

    <label class="popup__row popup__row--select">
      <span>PowerPoint renderer</span>
      <select id="pptx-renderer">
        <option value="aiden0z">aiden0z (lean)</option>
        <option value="ordalie">Ordalie (feature-rich)</option>
      </select>
    </label>

    <label class="popup__row">
      <input type="checkbox" id="toggle-maxfidelity" />
      <span>Max-fidelity mode <em>(experimental; needs engine)</em></span>
    </label>

    <button id="btn-bakeoff" class="btn" type="button">Compare renderers…</button>
    <button id="btn-open-viewer" class="btn btn--primary" type="button">Open viewer</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
