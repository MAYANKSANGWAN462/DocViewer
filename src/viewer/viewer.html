<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocViewer</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar__left">
        <span class="brand">DocViewer</span>
        <span id="filename" class="filename" aria-live="polite"></span>
        <span id="type-badge" class="badge" hidden></span>
      </div>
      <div class="toolbar__right">
        <div id="zoom-controls" class="zoombar" hidden role="group" aria-label="Zoom">
          <button id="btn-zoom-out" class="btn btn--icon" type="button" title="Zoom out" aria-label="Zoom out">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="6.5" cy="6.5" r="4"/>
              <line x1="4.5" y1="6.5" x2="8.5" y2="6.5"/>
              <line x1="11" y1="11" x2="13.5" y2="13.5"/>
            </svg>
          </button>
          <button id="btn-zoom-level" class="btn zoombar__level" type="button" title="Reset to fit">100%</button>
          <button id="btn-zoom-in" class="btn btn--icon" type="button" title="Zoom in" aria-label="Zoom in">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="6.5" cy="6.5" r="4"/>
              <line x1="6.5" y1="4" x2="6.5" y2="9"/>
              <line x1="4" y1="6.5" x2="9" y2="6.5"/>
              <line x1="11" y1="11" x2="13.5" y2="13.5"/>
            </svg>
          </button>
          <button id="btn-zoom-fit" class="btn" type="button" title="Fit to width">Fit</button>
        </div>

        <button id="btn-open" class="btn btn--icon-label" type="button" title="Open a document from your computer" aria-label="Open a document from your computer">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 4a1 1 0 011-1h3l1.5 2H13a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1V4z"/>
          </svg>
          Open file…
        </button>

        <!-- Overflow: rare actions (open original). Shown only when a URL source is active. -->
        <div id="overflow-wrap" class="overflow-wrap" hidden>
          <button id="btn-overflow" class="btn btn--icon" type="button" title="More options" aria-label="More options" aria-haspopup="true" aria-expanded="false">
            <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <circle cx="4" cy="8" r="1.4"/>
              <circle cx="8" cy="8" r="1.4"/>
              <circle cx="12" cy="8" r="1.4"/>
            </svg>
          </button>
          <div id="overflow-menu" class="overflow-menu" hidden>
            <button id="btn-open-original" class="btn" type="button" title="Open the original document in a new tab" aria-label="Open the original document in a new tab">Open original</button>
          </div>
        </div>

        <button id="btn-download" class="btn btn--primary btn--icon-label" type="button" title="Save this file to your computer" aria-label="Download this file" disabled>
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 2v8"/>
            <path d="M5 7l3 3 3-3"/>
            <line x1="2.5" y1="13" x2="13.5" y2="13"/>
          </svg>
          Download
        </button>
      </div>
    </header>

    <main id="stage" class="stage">
      <section id="dropzone" class="dropzone">
        <div class="dropzone__inner">
          <!-- Document + drop-arrow icon -->
          <svg class="dropzone__icon" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="6" width="28" height="36" rx="2"/>
            <path d="M28 6v10h8" fill="none"/>
            <line x1="14" y1="24" x2="30" y2="24"/>
            <line x1="14" y1="29" x2="26" y2="29"/>
            <circle cx="42" cy="42" r="10" fill="var(--surface)" stroke-width="1.4"/>
            <path d="M42 36v9"/>
            <path d="M38.5 42l3.5 3.5 3.5-3.5"/>
          </svg>
          <h1>Drop a document here</h1>
          <p>Word, Excel, PowerPoint or CSV&hairsp;— nothing leaves your browser.</p>
          <button id="btn-pick" class="btn btn--primary" type="button" title="Browse for a document to preview" aria-label="Choose a file to preview">Choose a file</button>
          <p class="hint">PDFs open in Chrome's built-in viewer and are not handled here.</p>
        </div>
      </section>

      <section id="content" class="content" hidden></section>

      <section id="loading" class="overlay" hidden>
        <div class="spinner" role="status" aria-label="Loading"></div>
        <p id="loading-text">Loading…</p>
        <button
          id="btn-loading-download"
          class="btn btn--primary btn--icon-label"
          type="button"
          title="Save the original file to your computer"
          aria-label="Download the original file"
          hidden
        >
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 2v8"/><path d="M5 7l3 3 3-3"/><line x1="2.5" y1="13" x2="13.5" y2="13"/>
          </svg>
          Download instead
        </button>
      </section>

      <section id="size-warn" class="panel" hidden>
        <h2>Large file</h2>
        <p id="size-warn-text"></p>
        <div class="panel__actions">
          <button id="btn-render-anyway" class="btn btn--primary" type="button">Render anyway</button>
          <button id="btn-cancel-render" class="btn" type="button">Cancel</button>
        </div>
      </section>

      <section id="error" class="panel panel--error" hidden>
        <h2 id="error-title">Something went wrong</h2>
        <p id="error-text"></p>
        <div class="panel__actions">
          <button id="btn-error-download" class="btn btn--primary btn--icon-label" type="button" title="Save the original file to your computer" aria-label="Download the original file" hidden>
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 2v8"/><path d="M5 7l3 3 3-3"/><line x1="2.5" y1="13" x2="13.5" y2="13"/>
            </svg>
            Download original
          </button>
          <button id="btn-error-open" class="btn" type="button" title="Open the original document URL in a new tab" aria-label="Open the original URL in a new tab" hidden>Open original URL</button>
        </div>
      </section>
    </main>

    <input id="file-input" type="file" hidden accept=".csv,.xlsx,.xls,.docx,.doc,.pptx,.ppt" />

    <script type="module" src="viewer.js"></script>
  </body>
</html>
